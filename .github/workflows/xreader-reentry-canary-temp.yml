name: x-reader one-time Linux reentry canary
on:
  pull_request:
    paths:
      - ".github/workflows/xreader-reentry-canary-temp.yml"
permissions:
  contents: read
jobs:
  reentry-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Real GitHub download failure and recovery in an isolated cache
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/xreader-isolated-home"
          export XDG_CACHE_HOME="$HOME/.cache"
          mkdir -p "$HOME"
          python3 - <<'PY'
          from pathlib import Path
          import os
          src = Path("skills/x-reader/SKILL.md").read_text(encoding="utf-8")
          start = src.index("XR_CLI_COMMIT=")
          end = src.index("\n" + chr(96) * 3, start)
          bootstrap = src[start:end]
          assert "git+https://github.com/runesleo/x-reader.git@" in bootstrap
          assert "--force-reinstall" in bootstrap
          Path(os.environ["RUNNER_TEMP"], "xreader-reentry.sh").write_text(
              "set -e\n" + bootstrap + '\n"$XR_BIN" doctor --json\n',
              encoding="utf-8",
          )
          PY
          if GIT_CONFIG_COUNT=1              GIT_CONFIG_KEY_0='url.http://127.0.0.1:9/.insteadOf'              GIT_CONFIG_VALUE_0='https://github.com/'              bash "$RUNNER_TEMP/xreader-reentry.sh" >"$RUNNER_TEMP/expected-failure.log" 2>&1; then
            echo "Unexpected success during simulated GitHub transport outage" >&2
            exit 1
          fi
          if ! grep -Eq '127[.]0[.]0[.]1|Connection refused|Failed to connect|Could not connect' "$RUNNER_TEMP/expected-failure.log"; then
            echo "Failure was not the intended Git transport error" >&2
            exit 1
          fi
          echo "CANARY_GITHUB_TRANSPORT_FAILURE_REJECTED=1"
          bash "$RUNNER_TEMP/xreader-reentry.sh" >"$RUNNER_TEMP/first-recovery.log"
          echo "CANARY_GITHUB_PINNED_RETRY_OK=1"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          cache = Path(os.environ["XDG_CACHE_HOME"]) / "x-reader"
          venv = next(cache.glob("venv-*"))
          p = subprocess.run([str(venv / "bin/x-reader"), "https://example.com", "--json"],
              capture_output=True, text=True, timeout=30)
          assert p.returncode == 0, p.stderr[-1200:]
          data = json.loads(p.stdout)
          assert len(data.get("content") or "") >= 100, data
          print("CANARY_LINUX_REAL_FIRST_READ_OK=1")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          cache = Path(os.environ["XDG_CACHE_HOME"]) / "x-reader"
          venvs = list(cache.glob("venv-*"))
          assert len(venvs) == 1, venvs
          venv = venvs[0]
          cli = venv / "bin/x-reader"
          probe = subprocess.run([str(venv / "bin/python"), "-c",
              "import loguru; print(loguru.__file__)"], capture_output=True, text=True, check=True)
          mod = Path(probe.stdout.strip()).parent
          assert mod.name == "loguru" and mod.is_dir()
          mod.rename(mod.with_name("loguru.corrupted"))
          assert subprocess.run([str(cli), "doctor", "--json"],
              capture_output=True).returncode != 0
          PY
          bash "$RUNNER_TEMP/xreader-reentry.sh" >"$RUNNER_TEMP/dep-recovery.log"
          echo "CANARY_CORE_DEPENDENCY_RECOVERED=1"
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          venv = next((Path(os.environ["XDG_CACHE_HOME"]) / "x-reader").glob("venv-*"))
          cli = venv / "bin/x-reader"
          probe = subprocess.run([str(venv / "bin/python"), "-c",
              "import pip; print(pip.__file__)"], capture_output=True, text=True, check=True)
          pip_pkg = Path(probe.stdout.strip()).parent
          assert pip_pkg.name == "pip" and pip_pkg.is_dir()
          pip_pkg.rename(pip_pkg.with_name("pip.corrupted"))
          cli.write_text("#!/bin/sh\nexit 41\n", encoding="utf-8")
          cli.chmod(0o755)
          assert subprocess.run([str(venv / "bin/python"), "-m", "pip", "--version"],
              capture_output=True).returncode != 0
          PY
          bash "$RUNNER_TEMP/xreader-reentry.sh" >"$RUNNER_TEMP/pip-recovery.log"
          echo "CANARY_PIP_AND_CLI_RECOVERED=1"
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess, json
          venv = next((Path(os.environ["XDG_CACHE_HOME"]) / "x-reader").glob("venv-*"))
          report = subprocess.run([str(venv / "bin/x-reader"), "doctor", "--json"],
              text=True, capture_output=True, check=True)
          assert json.loads(report.stdout)["ready"] is True
          print("CANARY_LINUX_READY_VERIFIED=1")
          PY

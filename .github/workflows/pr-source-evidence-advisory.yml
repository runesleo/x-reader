name: PR Source Evidence (advisory)

# No secrets, no GitHub App and no privileged pull_request_target event.
# An untrusted PR can alter the check itself: advisory only, never release-gate truth.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  evidence:
    name: Source evidence (advisory, not a fact-check)
    if: contains(github.event.pull_request.body, '<!-- x-reader:evidence -->')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install existing x-reader
        run: python -m pip install -e .

      - name: Evaluate opted-in public URL sources
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/github_pr_source_evidence_advisory.py \
            --event "$GITHUB_EVENT_PATH" \
            --summary "$GITHUB_STEP_SUMMARY"

name: x-reader Cloud guard

on:
  push:
    branches: [feat/cloud-railway-oauth-20261008]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install legacy MCP SDK 1.x
        run: python -m pip install -e ".[mcp]"
      - name: Full suite against original stdio/SSE MCP
        run: python -m unittest discover -s tests -p "test_*.py"

  cloud-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated FastMCP 4 Cloud dependencies
        run: python -m pip install -e ".[cloud]"
      - name: Cloud authorization/config tests
        run: python -m unittest discover -s tests -p "test_cloud_*.py"
      - name: Public-reader HTTP and SSRF regression tests
        run: |
          python -m unittest discover -s tests -p "test_web_*.py"
          python -m unittest discover -s tests -p "test_http_*.py"
          python -m unittest discover -s tests -p "test_url_validator.py"
      - name: Compile package
        run: python -m compileall -q x_reader
      - name: Build Docker image
        run: docker build --pull -f Dockerfile.cloud -t x-reader-cloud-ci .
      - name: Volume and HTTP auth canary (fake test credentials only)
        run: |
          mkdir -p "$RUNNER_TEMP/xreader-oauth"
          KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          FERNET=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          docker run --rm -d --name x-reader-cloud-ci \
            -p 127.0.0.1:18787:8000 \
            -v "$RUNNER_TEMP/xreader-oauth:/data" \
            -e PORT=8000 \
            -e PUBLIC_URL=https://x-reader-test.example.com \
            -e GITHUB_OAUTH_CLIENT_ID=ci-placeholder \
            -e GITHUB_OAUTH_CLIENT_SECRET=ci-placeholder \
            -e X_READER_ALLOWED_GITHUB_LOGIN=runesleo \
            -e X_READER_JWT_SIGNING_KEY="$KEY" \
            -e X_READER_STORAGE_FERNET_KEY="$FERNET" \
            x-reader-cloud-ci
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:18787/healthz; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18787/healthz | grep -q x-reader-cloud
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
            -X POST http://127.0.0.1:18787/mcp \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          test "$STATUS" = 401
          echo "HEALTHZ=PASS UNAUTHENTICATED_MCP=401"
          echo "LIVE_X_CANARY: cloud Docker image reading public X source"
          docker exec --user xreader -i x-reader-cloud-ci python - <<'PY'
          import json
          from x_reader.web_app import read_public_url

          url = "https://x.com/dontbesilent/status/2103875422522077377"
          result = read_public_url(url)
          receipt = result["receipt"]
          summary = {
              "url": url,
              "status": receipt["status"],
              "post_text": receipt.get("components", {}).get("post_text"),
              "attached_media": receipt.get("components", {}).get("attached_media"),
              "reason_code": receipt.get("reason_code"),
              "fetch_method": receipt.get("fetch_method"),
          }
          print("LIVE_X_RECEIPT=" + json.dumps(summary, ensure_ascii=False))
          assert receipt["status"] == "PARTIAL", summary
          assert receipt["components"]["post_text"] == "PASS", summary
          assert receipt["components"]["attached_media"] == "PARTIAL", summary
          print("LIVE_X_CANARY=PASS")
          PY
          docker stop x-reader-cloud-ci

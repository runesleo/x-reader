# nginx in front of the reader (TLS lines from certbot omitted).
# In the http {} block:
#   limit_req_zone  $binary_remote_addr zone=xreader_api:10m rate=12r/m;
#   limit_conn_zone $binary_remote_addr zone=xreader_addr:10m;
#
# nginx buffers each request completely before proxying it (proxy_request_buffering
# is on by default), so slow or dripping clients are held by nginx, never by the
# reader; the reader also cuts off any request not fully read within 20 s.
server {
    server_name xreader.example.com;
    server_tokens off;
    client_max_body_size 8k;
    limit_req_status 429;
    limit_conn_status 429;

    # Errors nginx generates itself answer in the reader's JSON shape.
    error_page 413 = @too_large;
    error_page 429 = @busy;
    error_page 502 503 504 = @unavailable;
    location @too_large { default_type application/json; add_header Cache-Control no-store always; return 413 '{"ok":false,"error":"request_body_too_large_or_empty"}'; }
    location @busy { default_type application/json; add_header Cache-Control no-store always; return 429 '{"ok":false,"error":"busy"}'; }
    location @unavailable { default_type application/json; add_header Cache-Control no-store always; return 503 '{"ok":false,"error":"unavailable"}'; }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location = /api/read {
        limit_req zone=xreader_api burst=4 nodelay;
        limit_conn xreader_addr 2;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 90s;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    listen 443 ssl;
    listen [::]:443 ssl;
}
